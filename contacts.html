<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контакты | PlatiMarket</title>
<meta name="description" content="Свяжитесь с поддержкой PlatiMarket: Telegram, email и часы работы.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&subset=cyrillic&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contacts">
<div id="site-header"></div>
<div id="notice-bar"></div>
<main>

<section class="page-hero"><div class="container">
  <div class="eyebrow"><span data-icon="send" data-size="16"></span>Контакты</div>
  <h1>Свяжитесь с нами</h1>
  <p class="lead">Отвечаем в рабочие часы, указанные ниже. Для бизнес-интеграций опишите задачу — поможем выбрать подходящий способ подключения.</p>
</div></section>

<section class="section"><div class="container">
  <div class="grid grid-3" id="contact-cards"></div>
</div></section>

</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const c = SITE.contacts;
  document.getElementById('contact-cards').innerHTML = `
    <div class="card reveal">
      <div class="card-icon"><span data-icon="send" data-size="24"></span></div>
      <h3>Telegram</h3>
      <p>Самый быстрый способ связи с поддержкой.</p>
      <a class="btn btn-soft btn-block" href="${c.tg}" target="_blank" rel="noopener">${c.tgHandle}</a>
    </div>
    <div class="card reveal" style="--d:.08s">
      <div class="card-icon teal"><span data-icon="mail" data-size="24"></span></div>
      <h3>Email</h3>
      <p>Для развёрнутых вопросов и бизнес-интеграций.</p>
      <a class="btn btn-soft btn-block" href="mailto:${c.email}">${c.email}</a>
    </div>
    <div class="card reveal" style="--d:.16s">
      <div class="card-icon green"><span data-icon="clock" data-size="24"></span></div>
      <h3>Часы работы</h3>
      <p>Поддержка отвечает ${c.hours}.</p>
    </div>`;
  renderIcons();
});
</script>
</body>
</html>
